name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests on python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The scripts run on the user's own Python: 3.9 is the oldest one supported, the other the newest.
        python: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
      - name: pytest
        run: uvx --python "${{ matrix.python }}" --no-config pytest -q -p no:cacheprovider tests

  version:
    # A pull request that changes plugin/ must raise the version: merging into main is a release.
    name: version raised when plugin/ changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check
        run: python3 .github/scripts/version_bumped.py "origin/${{ github.base_ref }}"
